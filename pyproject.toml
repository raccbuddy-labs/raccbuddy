[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Ruff's default rule set grew after the last green CI run (March 2026).
# These ignores keep `ruff check` on the checks this tree was written for.
# Adopt the newer style rules in a dedicated change rather than rewriting
# every file that predates them.
ignore = [
    "ASYNC230",
    "BLE001",
    "FLY002",
    "FURB162",
    "G201",
    "I001",
    "PIE790",
    "PLW0602",
    "RUF022",
    "RUF046",
    "RUF059",
    "RUF100",
    "S110",
    "SIM102",
    "SIM103",
    "SIM117",
    "UP006",
    "UP007",
    "UP017",
    "UP035",
    "UP037",
    "UP045",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    # websockets.legacy deprecation from python-telegram-bot transitive dep
    "ignore:websockets\\.legacy is deprecated:DeprecationWarning",
    # websockets.server.WebSocketServerProtocol deprecation (uvicorn)
    "ignore:websockets\\.server\\.WebSocketServerProtocol is deprecated:DeprecationWarning",
    # uvicorn thread started during skill-loader tests
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
    # GC-collected coroutines from AsyncMock session.add() / unawaited child mocks
    "ignore:coroutine 'AsyncMockMixin._execute_mock_call' was never awaited:RuntimeWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "ruff>=0.15.4",
]
