services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: raccbuddy
      POSTGRES_PASSWORD: raccbuddy
      POSTGRES_DB: raccbuddy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    # Healthcheck ensures the app never starts before Postgres is ready
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raccbuddy -d raccbuddy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: .
    # Expose the REST API port for external tooling / debugging.
    # The WhatsApp bridge reaches it via internal Docker network (no public exposure needed).
    # Uncomment the line below to expose on the host machine:
    # ports:
    #   - "8000:8000"
    environment:
      # Required: Set your Telegram bot token
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - OWNER_TELEGRAM_ID=${OWNER_TELEGRAM_ID:-0}

      # WhatsApp
      - OWNER_WHATSAPP_NUMBER=${OWNER_WHATSAPP_NUMBER:-}

      # Database
      - DATABASE_URL=postgresql+asyncpg://raccbuddy:raccbuddy@db:5432/raccbuddy

      # LLM Configuration
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-ollama}

      # Ollama (use host.docker.internal to reach host machine's Ollama)
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}

      # xAI (optional)
      - XAI_API_KEY=${XAI_API_KEY:-}
      - XAI_MODEL=${XAI_MODEL:-grok-4-1-fast-reasoning}

      # Context window — sent as num_ctx to Ollama (MUST match Ollama's loaded model capacity)
      - MAX_CONTEXT_TOKENS=${MAX_CONTEXT_TOKENS:-30000}

      # Optional settings
      - NUDGE_CHECK_INTERVAL_MINUTES=${NUDGE_CHECK_INTERVAL_MINUTES:-60}
      - OWNER_MEMORY_RETENTION_DAYS=${OWNER_MEMORY_RETENTION_DAYS:-90}

      # Agentic / proactive core (opt-in)
      - AGENTIC_ENABLED=${AGENTIC_ENABLED:-false}
      - CHECKPOINTER_BACKEND=${CHECKPOINTER_BACKEND:-postgres}
      - MAX_CYCLE_TOKENS=${MAX_CYCLE_TOKENS:-8192}
      - AGENTIC_CYCLE_INTERVAL_MINUTES=${AGENTIC_CYCLE_INTERVAL_MINUTES:-30}

      # xAI / Grok optional toggle
      - XAI_ENABLE_BUILTIN_TOOLS=${XAI_ENABLE_BUILTIN_TOOLS:-false}

      # Langfuse tracing (optional)
      - LANGFUSE_ENABLED=${LANGFUSE_ENABLED:-false}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-http://localhost:3000}

      # Prometheus metrics (optional)
      - PROMETHEUS_ENABLED=${PROMETHEUS_ENABLED:-false}
      - PROMETHEUS_PORT=${PROMETHEUS_PORT:-9090}

      # Summaries / memory
      - MAX_SUMMARY_WORDS=${MAX_SUMMARY_WORDS:-150}

      # API security — generate with: python -c "import secrets; print(secrets.token_hex(32))"
      - API_SECRET_KEY=${API_SECRET_KEY:-}

      # Voice (optional)
      - VOICE_ENABLED=${VOICE_ENABLED:-false}
      - VOICE_REPLY_MODE=${VOICE_REPLY_MODE:-text}

      # IMAP pull connector (optional, off unless IMAP_ENABLED=true)
      - IMAP_ENABLED=${IMAP_ENABLED:-false}
      - IMAP_HOST=${IMAP_HOST:-}
      - IMAP_PORT=${IMAP_PORT:-993}
      - IMAP_USERNAME=${IMAP_USERNAME:-}
      - IMAP_PASSWORD=${IMAP_PASSWORD:-}
      - IMAP_SSL=${IMAP_SSL:-true}
      - IMAP_OWNER_ADDRESS=${IMAP_OWNER_ADDRESS:-}
      - IMAP_MAILBOXES=${IMAP_MAILBOXES:-INBOX,Sent}
      - IMAP_HISTORY_MAX=${IMAP_HISTORY_MAX:-500}
      - IMAP_SYNC_INTERVAL_SECONDS=${IMAP_SYNC_INTERVAL_SECONDS:-300}

      # Matrix pull connector (optional, unencrypted rooms only)
      - MATRIX_ENABLED=${MATRIX_ENABLED:-false}
      - MATRIX_HOMESERVER=${MATRIX_HOMESERVER:-}
      - MATRIX_ACCESS_TOKEN=${MATRIX_ACCESS_TOKEN:-}
      - MATRIX_USER_ID=${MATRIX_USER_ID:-}
      - MATRIX_HISTORY_MAX_PER_ROOM=${MATRIX_HISTORY_MAX_PER_ROOM:-500}
      - MATRIX_PAGE_SIZE=${MATRIX_PAGE_SIZE:-50}
      - MATRIX_HISTORY_PAUSE_SECONDS=${MATRIX_HISTORY_PAUSE_SECONDS:-0.2}
      - MATRIX_SYNC_INTERVAL_SECONDS=${MATRIX_SYNC_INTERVAL_SECONDS:-60}

    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  whatsapp:
    build: ./whatsapp-service
    environment:
      - PORT=3001
      - PYTHON_CORE_URL=http://app:8000
      # Must match API_SECRET_KEY set on the app service
      - API_SECRET_KEY=${API_SECRET_KEY:-}
      - WHATSAPP_HISTORY_ENABLED=${WHATSAPP_HISTORY_ENABLED:-true}
      - WHATSAPP_HISTORY_MAX_PER_CHAT=${WHATSAPP_HISTORY_MAX_PER_CHAT:-500}
      - WHATSAPP_HISTORY_PAGE_SIZE=${WHATSAPP_HISTORY_PAGE_SIZE:-100}
    volumes:
      - wa-session:/app/.wwebjs_auth
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  wa-session:
